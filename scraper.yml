name: SMART Dashboard 24/7 Cloud Scraper

on:
  schedule:
    # Runs every 5 minutes 24/7 automatically in the cloud
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  scrape_and_sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-policy: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright gspread oauth2client
          playwright install chromium

      - name: Execute Scraper
        env:
          SMART_URL: ${{ secrets.SMART_URL }}
          SMART_USERNAME: ${{ secrets.SMART_USERNAME }}
          SMART_PASSWORD: ${{ secrets.SMART_PASSWORD }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
        run: |
          python smart_trax_scraper.py
